schema_version: 1
protocol_id: ccs-relocalization-v1
enabled: true
backend: scout_mini
network: {bind_host: 0.0.0.0, control_port: 14565, ground_station_ip: 192.168.50.101, status_port: 14566, max_datagram_bytes: 1400}
storage: {map_root: /home/nvidia/livox_fastlio/maps/ccs_download, active_map_state_file: /home/nvidia/.ros/ccs_edge_dev/state/relocalization.json, max_artifact_bytes: 4294967296, download_timeout_seconds: 300.0}
ros:
  map_frame: map
  odom_frame: odom
  initial_pose_topic: /initialpose
  map_topic: /map_2d
  startup_timeout_seconds: 60.0
  stages:
    - {name: fastlio, package: scout_system_bringup, launch: fastlio_local_odom.launch, args: []}
    - {name: tf_manager, package: scout_tf_manager, launch: tf_manager.launch, args: []}
    - {name: pose_adapter, package: scout_pose_adapter, launch: pose_adapter.launch, args: []}
    - {name: cloud_adapter, package: scout_cloud_adapter, launch: cloud_adapter.launch, args: []}
    - {name: global_relocalization, package: scout_system_bringup, launch: scout_relocalization.launch, args: ["map_name:={map_id}", "map_dir:={map_dir}", "map_pcd:={map_pcd}"]}
    - {name: map_server, package: epgeneral_relocalization, launch: relocalization_map_server.launch, args: ["map_yaml:={map_yaml}"]}
tf_stability: {timeout_seconds: 30.0, sample_hz: 10.0, sample_count: 10, translation_tolerance_m: 0.10, yaw_tolerance_deg: 2.0}
