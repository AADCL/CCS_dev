schema_version: 6
protocol_id: "ccs-map-stream-v2"

network:
  bind_host: "0.0.0.0"
  control_port: 14561
  ground_station_ip: "192.168.50.101"
  data_port: 14562
  max_datagram_bytes: 1400

http: {bind_host: "0.0.0.0", port: 14600, token_ttl_seconds: 900.0}

ros:
  inputs:
    lidar: {topic: "/livox/lidar", message_type: "livox_ros_driver2/CustomMsg", frame: "livox_frame"}
    imu: {topic: "/livox/imu", message_type: "sensor_msgs/Imu", frame: "livox_frame"}
  stream:
    cloud:
      topic: "/cloud_registered_body"
      message_type: "sensor_msgs/PointCloud2"
      frame: "body"
      coordinates: "sensor"
    pose:
      topic: "/fastlio_odom"
      message_type: "nav_msgs/Odometry"
      position_path: "pose.pose.position"
      orientation_path: "pose.pose.orientation"
  frames: {map: "odom", preview: "odom", body: "base_link", sensor: "body"}
  # Inverse of the measured base_link -> body transform (0.25, 0, 0.20, pitch 45 deg).
  body_from_sensor:
    x: -0.0353553391
    y: 0.0
    z: -0.3181980515
    qx: 0.0
    qy: -0.3826834324
    qz: 0.0
    qw: 0.9238795325

integrations:
  backend: "scout_finalize"
  # Legacy fields remain present so schema 6 Go2 profiles stay load-compatible.
  mapping_prerequisites:
    setup_file: "/opt/ros/noetic/setup.bash"
    launch_file: "mapping_prerequisites.launch"
    extrinsics_file: "/home/nvidia/livox_fastlio/src/scout_tf_manager/config/extrinsics.yaml"
    startup_timeout_seconds: 15.0
  fast_lio:
    setup_file: "/opt/ros/noetic/setup.bash"
    package: "scout_system_bringup"
    launch_file: "fastlio_mapping_scout.launch"
    launch_args: []
    startup_timeout_seconds: 30.0
    stop_timeout_seconds: 30.0
    pid_path: "{session_dir}/scout_mapping.pid"
    log_path: "{session_dir}/scout_mapping.log"
  map_accumulator:
    setup_file: "/opt/ros/noetic/setup.bash"
    service: "/unused_scout_map_service"
    save_timeout_seconds: 60.0
  pgm:
    setup_file: "/opt/ros/noetic/setup.bash"
    package: "scout_map_tools"
    launch_file: "unused.launch"
    launch_args: []
    generation_timeout_seconds: 300.0
    log_path: "{session_dir}/finalize_map.log"
  scout:
    fast_lio_package: "scout_system_bringup"
    fast_lio_launch: "fastlio_mapping_scout.launch"
    tf_package: "scout_tf_manager"
    tf_launch: "tf_manager.launch"
    pose_package: "scout_pose_adapter"
    pose_launch: "pose_adapter.launch"
    finalize_package: "scout_map_tools"
    finalize_executable: "finalize_map.py"
    source_pcd_path: "/home/nvidia/livox_fastlio/src/FAST_LIO/PCD/scans.pcd"
    map_root: "/home/nvidia/livox_fastlio/maps"

sync: {tolerance_seconds: 0.05, pose_buffer_size: 100, preview_transform_timeout_seconds: 0.20}
preprocess: {sample_window_seconds: 1.0, preview_transport: "pcd_fragment_http", min_range_m: 0.30, max_range_m: 100.0, voxel_size_m: 0.05}
timeouts:
  prepare_probe_timeout_seconds: 1.5
  integration_check_timeout_seconds: 8.0
  ready_timeout_seconds: 60.0
  input_timeout_seconds: 3.0
  command_cache_seconds: 60.0
  artifact_poll_seconds: 0.5
  artifact_stable_polls: 2
limits:
  max_frame_points: 200000
  max_window_points: 1000000
  max_decompressed_bytes: 2400000
  max_artifact_bytes: 4294967296
  min_free_bytes: 5368709120
  command_output_bytes: 16384
  max_preview_fragment_bytes: 8388608
  max_pending_preview_fragments: 4
  max_unacked_preview_fragments: 16
artifacts:
  frame: "map"
  workspace_root: "/home/nvidia/.ros/ccs_edge_dev/map_stream"
  accumulator_pcd_path: "/home/nvidia/livox_fastlio/src/FAST_LIO/PCD/scans.pcd"
  source_pcd_path: "/home/nvidia/livox_fastlio/maps/current/public_map.pcd"
  source_pgm_path: "/home/nvidia/livox_fastlio/maps/current/map.pgm"
  source_yaml_path: "/home/nvidia/livox_fastlio/maps/current/map.yaml"
  archive_root: "/home/nvidia/livox_fastlio/maps/archive"
  pcd_path: "{session_dir}/map.pcd"
  pgm_path: "{session_dir}/map.pgm"
  yaml_path: "{session_dir}/map.yaml"
