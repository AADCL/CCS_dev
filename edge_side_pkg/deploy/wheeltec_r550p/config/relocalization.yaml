schema_version: 1
protocol_id: "ccs-relocalization-v1"
enabled: true
backend: "wheeltec_r550p"
network: {bind_host: "0.0.0.0", control_port: 14565, ground_station_ip: "192.168.50.101", status_port: 14566, max_datagram_bytes: 1400}
storage: {map_root: "/home/nrc19/livox_fastlio/maps/ccs_download", active_map_state_file: "/home/nrc19/.ros/ccs_edge_dev_wheeltec_r550p/state/relocalization.json", max_artifact_bytes: 4294967296, download_timeout_seconds: 300.0}
ros:
  map_frame: "map"
  odom_frame: "odom"
  initial_pose_topic: "/initialpose"
  map_topic: "/map_2d"
  startup_timeout_seconds: 60.0
  stages:
    - {name: fastlio, package: wheeltec_system_bringup, launch: fastlio_local_odom.launch, args: []}
    - {name: tf_manager, package: wheeltec_tf_manager, launch: tf_manager.launch, args: []}
    - {name: pose_adapter, package: wheeltec_pose_adapter, launch: pose_adapter.launch, args: []}
    - {name: cloud_adapter, package: wheeltec_cloud_adapter, launch: cloud_adapter.launch, args: []}
    - {name: global_relocalization, package: wheeltec_system_bringup, launch: wheeltec_relocalization.launch, args: ["map_pcd:={map_pcd}"]}
    - {name: map_server, package: epgeneral_relocalization, launch: relocalization_map_server.launch, args: ["map_yaml:={map_yaml}"]}
tf_stability: {timeout_seconds: 30.0, sample_hz: 10.0, sample_count: 10, translation_tolerance_m: 0.10, yaw_tolerance_deg: 2.0}
