mqtt:
  ground_station_ip: "192.168.50.101"
  port: 1883
  client_id_prefix: "mqtav-"
  qos: 1
  keepalive_seconds: 10
  heartbeat_hz: 1
  telemetry_hz: 1
  topics:
    presence: "mqtav/{device_id}/presence"
    heartbeat: "mqtav/{device_id}/heartbeat"
    status: "mqtav/{device_id}/status"
ros:
  node_name: "epgeneral_mqtav"
  connection:
    topic: "/go2/state/low_state"
    message_type: "go2_control/Go2LowState"
    timeout_seconds: 3.0
  state:
    topic: "/go2/control/enabled"
    message_type: "std_msgs/Bool"
    connected_on_message: true
    timeout_seconds: 3.0
    mapping: {connected: null, armed: data, system_status: null, mode: null}
  battery:
    enabled: true
    topic: "/go2/battery_state"
    message_type: "sensor_msgs/BatteryState"
    mapping: {percentage: percentage, voltage: voltage, current: current}
  mission:
    enabled: true
    topic: "/qrd/QRD_003/task_status"
    message_type: "std_msgs/String"
    field_path: data
