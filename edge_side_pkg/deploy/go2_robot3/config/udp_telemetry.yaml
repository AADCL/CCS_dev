schema_version: 1
protocol_id: "ccs-udp-telemetry-v1"
network: {destination_host: "192.168.50.101", destination_port: 14560, max_datagram_bytes: 16384}
descriptors:
  - {name: global_pose, display_name: "本地位姿", type: pose, level: 1, source: {topic: /odom_nav, message_type: nav_msgs/Odometry, mapping: {position: pose.pose.position, orientation: pose.pose.orientation}}}
  - {name: imu, display_name: "MID360 IMU", type: imu, level: 1, source: {topic: /go2/imu, message_type: sensor_msgs/Imu, mapping: {orientation: orientation, angular_velocity: angular_velocity, linear_acceleration: linear_acceleration}}}
  - {name: livox_pointcloud, display_name: "雷达点云", type: pointcloud_status, level: 2, source: {topic: /livox/lidar, timeout_seconds: 1.0}}
  - {name: livox_driver, display_name: "Livox 驱动", type: availability, level: 3, source: {topic: /livox/lidar, timeout_seconds: 3.0}}
  - {name: fastlio2, display_name: "FAST-LIO2 状态", type: availability, level: 3, source: {topic: /odom_nav, timeout_seconds: 3.0}}
  - {name: localization, display_name: "重定位状态", type: availability, level: 3, source: {topic: /localization/ok, timeout_seconds: 3.0}}
  - {name: chassis, display_name: "GO2 底盘状态", type: availability, level: 3, source: {topic: /go2/diagnostics, timeout_seconds: 3.0}}
  - {name: pgm_mapping, display_name: "PGM 地图状态", type: availability, level: 3, source: {kind: pgm_file, topic: /ccs/relocalization/pgm_file, state_file: /home/unitree/ccs_edge_ws/run/state/relocalization.json, map_root: /home/unitree/ccs_edge_ws/maps/download}}
