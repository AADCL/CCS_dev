schema_version: 3
protocol_id: "ccs-map-stream-v2"

network:
  bind_host: "0.0.0.0"
  control_port: 14561
  ground_station_ip: "192.168.50.101"
  data_port: 14562
  max_datagram_bytes: 1400

http:
  bind_host: "0.0.0.0"
  port: 14600
  token_ttl_seconds: 900.0

ros:
  inputs:
    lidar:
      topic: "/livox/lidar"
      message_type: "livox_ros_driver2/CustomMsg"
      frame: "livox_frame"
    imu:
      topic: "/livox/imu"
      message_type: "sensor_msgs/Imu"
      frame: "livox_frame"
  stream:
    cloud:
      topic: "/lio/cloud_registered_body"
      message_type: "sensor_msgs/PointCloud2"
      frame: "body_lio"
      coordinates: "sensor"
    pose:
      topic: "/lio/odometry"
      message_type: "nav_msgs/Odometry"
      position_path: "pose.pose.position"
      orientation_path: "pose.pose.orientation"
  frames:
    map: "lio_odom"
    body: "body_lio"
    sensor: "body_lio"
  body_from_sensor:
    x: 0.0
    y: 0.0
    z: 0.0
    qx: 0.0
    qy: 0.0
    qz: 0.0
    qw: 1.0

integrations:
  fast_lio:
    setup_file: "/home/nvidia/ccs_edge_ws/devel/setup.bash"
    package: "epgeneral_map_stream"
    launch_file: "fast_lio_mapping.launch"
    launch_args: []
    startup_timeout_seconds: 30.0
    stop_timeout_seconds: 30.0
    pid_path: "{session_dir}/fast_lio.pid"
    log_path: "{session_dir}/fast_lio.log"
  pgm:
    setup_file: "/home/nvidia/go2_mid360_nav/catkin_ws/devel/setup.bash"
    package: "go2_map_tools"
    launch_file: "pcd_to_pgm.launch"
    launch_args:
      - "config:=/home/nvidia/go2_mid360_nav/catkin_ws/src/go2_map_tools/config/corridor_nav.yaml"
    generation_timeout_seconds: 300.0
    log_path: "{session_dir}/pgm_generation.log"

sync:
  tolerance_seconds: 0.05
  pose_buffer_size: 100

preprocess:
  sample_window_seconds: 1.0
  preview_transport: "pcd_fragment_http"
  min_range_m: 0.30
  max_range_m: 100.0
  voxel_size_m: 0.05

timeouts:
  prepare_probe_timeout_seconds: 1.5
  ready_timeout_seconds: 60.0
  input_timeout_seconds: 3.0
  command_cache_seconds: 60.0
  artifact_poll_seconds: 0.5
  artifact_stable_polls: 2

limits:
  max_frame_points: 200000
  max_window_points: 1000000
  max_decompressed_bytes: 2400000
  max_artifact_bytes: 4294967296
  min_free_bytes: 5368709120
  command_output_bytes: 16384
  max_preview_fragment_bytes: 8388608
  max_pending_preview_fragments: 4
  max_unacked_preview_fragments: 16

artifacts:
  workspace_root: "/home/nvidia/.ros/ccs_edge_dev/map_stream"
  generated_pcd_path: "/home/nvidia/go2_mid360_nav/catkin_ws/src/vendor_links/FAST_LIO/PCD/scans.pcd"
  source_pcd_path: "/home/nvidia/go2_mid360_nav/maps/corridor_01/public_map.pcd"
  source_pgm_path: "/home/nvidia/go2_mid360_nav/maps/corridor_01/map.pgm"
  source_yaml_path: "/home/nvidia/go2_mid360_nav/maps/corridor_01/map.yaml"
  archive_root: "/home/nvidia/go2_mid360_nav/maps/corridor_01/archive"
  pcd_path: "{session_dir}/map.pcd"
  pgm_path: "{session_dir}/map.pgm"
  yaml_path: "{session_dir}/map.yaml"
